<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2A900">
<title>Home Build</title>
<style>
:root{--bg:#F1F2F4;--cd:#fff;--ink:#1B1F27;--mu:#6B7280;--ln:#E4E6EA;--ac:#F2A900;--ai:#1B1F27;--bl:#3D5A80;--ok:#2F9E6B;--rd:#D1495B;--sh:0 8px 28px rgba(27,31,39,.07);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0F1217;--cd:#1A1F27;--ink:#F1F3F6;--mu:#98A1B0;--ln:#2A313C;--ai:#14171C;--bl:#7FA3D1;--sh:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0F1217;--cd:#1A1F27;--ink:#F1F3F6;--mu:#98A1B0;--ln:#2A313C;--ai:#14171C;--bl:#7FA3D1;--sh:0 8px 28px rgba(0,0,0,.35);color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 ui-rounded,"SF Pro Rounded",system-ui,-apple-system,"Segoe UI",sans-serif;overflow:hidden}
#app{max-width:480px;height:100%;margin:0 auto;position:relative}
#view{height:100%;overflow-y:auto;padding:calc(env(safe-area-inset-top,0px) + 18px) 18px 130px;scrollbar-width:none}
.pg{animation:up .45s cubic-bezier(.2,.8,.2,1)}.pg.q{animation:none}
@keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:26px;letter-spacing:-.5px}h3{font-size:21px;letter-spacing:-.3px}.mu,.sm,small{color:var(--mu)}.sm,small{font-size:13.5px}
.ib{width:42px;height:42px;border:0;border-radius:14px;background:var(--cd);color:var(--ink);box-shadow:var(--sh);display:grid;place-items:center}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.card,.hero{background:var(--cd);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:var(--sh)}
.hero{background:var(--ai);color:#fff;padding:24px 22px;border-radius:30px;position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--ac);opacity:.18}
.hero h2{font-size:44px;letter-spacing:-1.5px;margin:6px 0 14px;font-weight:800}.hero h2.neg{color:#FF8A98}.hero p{opacity:.75;font-size:14px}.hero .sm{opacity:.85;margin-top:12px;color:#fff}
.bar{height:8px;border-radius:8px;background:rgba(255,255,255,.18);overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:8px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}.g{gap:8px;flex-wrap:wrap}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid .card{margin:0}
.tap{cursor:pointer;transition:transform .18s}.tap:active,.btn:active,.chip:active,.ib:active,.stp button:active{transform:scale(.95)}
.pill{padding:6px 12px;border-radius:20px;font-size:13px;font-weight:700}.ok{background:rgba(47,158,107,.15);color:var(--ok)}.warn{background:var(--ac);color:#1B1F27}
.note{background:rgba(242,169,0,.16);border-radius:16px;padding:12px 14px;margin-bottom:14px;font-size:14px;cursor:pointer}
.dn{width:96px;height:96px;transform:rotate(-90deg);flex:none}.dn circle{fill:none;stroke-width:11;stroke-linecap:round}.tr{stroke:var(--ln)}
.s1,.s2{stroke-dasharray:0 264;transition:stroke-dasharray 1.1s cubic-bezier(.2,.8,.2,1)}.s1{stroke:var(--ac)}.s2{stroke:var(--bl)}
.lg{display:flex;align-items:center;gap:8px;font-size:14px;margin:4px 0}.lg i{width:10px;height:10px;border-radius:50%}
.stp{display:flex;align-items:center;justify-content:center;gap:26px;margin:14px 0}.stp b{font-size:68px;min-width:90px;text-align:center;letter-spacing:-2px}
.stp button{width:64px;height:64px;border-radius:22px;border:0;font-size:30px;background:var(--ac);color:#1B1F27;font-weight:700;transition:transform .15s}.stp button:first-child{background:var(--bg);color:var(--ink)}
.chip{border:1px solid var(--ln);background:var(--cd);color:var(--ink);padding:9px 15px;border-radius:30px;font:inherit;font-size:14px;transition:.2s}.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;background:var(--ac);color:#1B1F27;font:inherit;font-weight:800;padding:15px 22px;border-radius:18px;flex:1;transition:transform .15s}.btn.gh{background:var(--bg);color:var(--rd);flex:none}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:10px;text-align:center}.cal small{font-size:11px}
.cal div.d{aspect-ratio:1;border-radius:13px;display:grid;place-items:center;font-size:13px;position:relative;cursor:pointer;transition:.2s}.d.f{background:rgba(242,169,0,.2);font-weight:700}.d.sel{background:var(--ink);color:var(--bg)}.d.td{outline:2px solid var(--ac)}.d em{position:absolute;bottom:3px;font-size:9px;font-style:normal;opacity:.7}
.it{display:flex;align-items:center;gap:12px;padding:13px 0;border-bottom:1px solid var(--ln);cursor:pointer;animation:up .4s both;animation-delay:calc(var(--i)*30ms)}.it:last-child{border:0}.it>div{flex:1;min-width:0}.it b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{width:38px;height:38px;border-radius:13px;flex:none}.dot.g{background:var(--ai)}.dot.l{background:var(--ac)}.dot.m{background:var(--bl)}.amt{font-weight:700}
.mb{margin:12px 0}.mb .row{font-size:14px;margin-bottom:5px}.mb .bar{background:var(--ln)}.mb .bar i{background:var(--bl)}
input[type=text],input[type=number],input[type=date],input:not([type]){width:100%;font:inherit;padding:14px;border-radius:15px;border:1.5px solid var(--ln);background:var(--bg);color:var(--ink);margin:6px 0 12px;outline:0;transition:border .2s}input:focus{border-color:var(--ac)}
label{font-size:13.5px;color:var(--mu)}.seg{display:flex;background:var(--bg);border-radius:16px;padding:4px;margin-bottom:14px}.seg button{flex:1;border:0;background:none;color:var(--mu);font:inherit;padding:11px;border-radius:12px;font-weight:600;transition:.25s}.seg button.on{background:var(--cd);color:var(--ink);box-shadow:var(--sh)}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;display:flex;justify-content:space-around;align-items:center;padding:10px 10px calc(env(safe-area-inset-bottom,0px) + 10px);background:color-mix(in srgb,var(--cd) 88%,transparent);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border-top:1px solid var(--ln);z-index:5}
nav button{background:none;border:0;color:var(--mu);font:inherit;font-size:11.5px;display:flex;flex-direction:column;align-items:center;gap:3px;width:64px;transition:.2s}nav button.on{color:var(--ink);font-weight:700}nav button.on svg{stroke:var(--ac);transform:translateY(-2px)}
nav .plus{width:58px;height:58px;border-radius:20px;background:var(--ac);color:#1B1F27;margin-top:-26px;box-shadow:0 10px 24px rgba(242,169,0,.45);justify-content:center}
#ov{position:fixed;inset:0;background:rgba(10,12,16,.5);opacity:0;pointer-events:none;transition:opacity .3s;z-index:8}#ov.open{opacity:1;pointer-events:auto}
#sh{position:fixed;left:50%;bottom:0;width:100%;max-width:480px;transform:translate(-50%,105%);transition:transform .45s cubic-bezier(.2,1,.3,1);background:var(--cd);border-radius:28px 28px 0 0;padding:12px 20px calc(env(safe-area-inset-bottom,0px) + 22px);z-index:9;max-height:90%;overflow-y:auto}#sh.open{transform:translate(-50%,0)}
.grab{width:42px;height:5px;border-radius:5px;background:var(--ln);margin:0 auto 16px}details summary{color:var(--mu);font-size:14px;margin-bottom:10px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 100px);transform:translate(-50%,30px);background:var(--ink);color:var(--bg);padding:12px 18px;border-radius:16px;opacity:0;transition:.35s;z-index:12;display:flex;gap:14px;font-size:14px;pointer-events:none;white-space:nowrap}#toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}#toast u{color:var(--ac);font-weight:700}
.shk{animation:shk .35s}@keyframes shk{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.empty{text-align:center;padding:30px 10px;color:var(--mu)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app"><main id="view"></main>
<nav><button data-t="home">__home__Home</button><button data-t="work">__users__Workers</button><button class="plus" data-a="add" aria-label="Add">__plus__</button><button data-t="mats">__box__Materials</button><button data-t="hist">__clock__History</button></nav></div>
<div id="ov" data-a="close"></div><div id="sh"></div><div id="toast"></div>
<script>
const IC={home:'<path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1z"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c0-3.6 3-6 6.5-6s6.5 2.4 6.5 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2.2.6 3.5 2.4 3.5 5"/>',box:'<path d="M21 8l-9-5-9 5v8l9 5 9-5zM3 8l9 5 9-5M12 13v8"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9L7 7M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>',plus:'<path d="M12 5v14M5 12h14"/>'};
const ic=n=>'<svg class="i" viewBox="0 0 24 24">'+IC[n]+'</svg>';
document.querySelectorAll('nav button').forEach(b=>b.innerHTML=b.innerHTML.replace(/__(\w+)__/,(m,k)=>ic(k)));
const $=s=>document.querySelector(s),f=n=>(n<0?'−':'')+'₹'+Math.round(Math.abs(n)).toLocaleString('en-IN');
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10),TD=()=>iso(new Date()),uid=()=>Math.random().toString(36).slice(2,9);
const fd=s=>{const[y,m,d]=s.split('-');return new Date(y,m-1,d).toLocaleDateString('en-IN',{day:'numeric',month:'short'})};
const esc=s=>String(s||'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let S={wage:700,given:[],mats:[],days:{},theme:'auto',lastBackup:0,ts:0},tab='home',selDay=TD(),flt='all',q='',cal=new Date(),sh={t:'g',id:null,dr:{}},persisted='';
/* storage: IndexedDB + localStorage mirror */
const idb=()=>new Promise((r,j)=>{const o=indexedDB.open('homebuild',1);o.onupgradeneeded=()=>o.result.createObjectStore('k');o.onsuccess=()=>r(o.result);o.onerror=()=>j(o.error)});
async function load(){let a=null,b=null;try{const d=await idb();a=await new Promise(r=>{const g=d.transaction('k').objectStore('k').get('s');g.onsuccess=()=>r(g.result);g.onerror=()=>r()})}catch(e){}
try{b=JSON.parse(localStorage.getItem('homebuild'))}catch(e){}
const best=[a,b].filter(Boolean).sort((x,y)=>(y.ts||0)-(x.ts||0))[0];if(best)S=Object.assign(S,best);
try{if(navigator.storage&&navigator.storage.persist)persisted=(await navigator.storage.persist())?'on':'off'}catch(e){}
theme();render()}
function save(){S.ts=Date.now();try{localStorage.setItem('homebuild',JSON.stringify(S))}catch(e){}
idb().then(d=>d.transaction('k','readwrite').objectStore('k').put(JSON.parse(JSON.stringify(S)),'s')).catch(()=>{})}
function theme(){if(S.theme==='auto')document.documentElement.removeAttribute('data-theme');else document.documentElement.dataset.theme=S.theme}
const sum=a=>a.reduce((x,y)=>x+y.amt,0),lab=()=>Object.values(S.days).reduce((a,d)=>a+d.n*d.wage,0);
/* views */
function bk(){const has=S.given.length+S.mats.length+Object.keys(S.days).length;return has&&Date.now()-S.lastBackup>12096e5?'<div class="note" data-a="backup">Save a backup copy of your data. Tap here.</div>':''}
function home(){const g=sum(S.given),l=lab(),m=sum(S.mats),b=g-l,dd=S.days[TD()],pc=g?Math.min(100,l/g*100):0,t=l+m,C=263.9,lp=t?l/t*C:0,mp=t?m/t*C:0;
return `<header><div><p class="mu sm">${new Date().toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'})}</p><h1>My Home Build</h1></div><button class="ib" data-a="sett" aria-label="Settings">${ic('gear')}</button></header>${bk()}
<section class="hero"><p>Still with the contractor</p><h2 class="${b<0?'neg':''}" data-n="${b}">${f(0)}</h2><div class="bar"><i data-w="${pc}"></i></div><p class="sm">${!g&&!l?'Add the money you give him to get started.':b>=0?`You’ve given ${f(g)} and he’s spent ${f(l)} on labour.`:`He’s spent ${f(-b)} more on labour than you’ve given.`}</p></section>
<section class="card row tap" data-a="go-work"><div><p class="mu sm">Workers today</p><h3>${dd?`${dd.n} · ${f(dd.n*dd.wage)}`:'Not filled yet'}</h3></div><span class="pill ${dd?'ok':'warn'}">${dd?'Done':'Fill now'}</span></section>
<div class="grid"><section class="card tap" data-a="go-work"><p class="mu sm">Labour spent</p><h3 data-n="${l}">${f(0)}</h3></section><section class="card tap" data-a="go-mats"><p class="mu sm">Materials</p><h3 data-n="${m}">${f(0)}</h3></section></div>
<section class="card row" style="margin-top:14px"><svg class="dn" viewBox="0 0 100 100"><circle class="tr" cx="50" cy="50" r="42"/><circle class="s1" cx="50" cy="50" r="42" data-d="${lp} ${C-lp}"/><circle class="s2" cx="50" cy="50" r="42" style="stroke-dashoffset:${-lp}" data-d="${mp} ${C-mp}"/></svg><div style="flex:1"><p class="mu sm">Total spent on the build</p><h3 data-n="${t}">${f(0)}</h3><div class="lg"><i style="background:var(--ac)"></i>Labour ${f(l)}</div><div class="lg"><i style="background:var(--bl)"></i>Materials ${f(m)}</div></div></section>`}
function work(){const d=S.days[selDay],n=d?d.n:0,w=d?d.wage:S.wage,isT=selDay===TD(),y=cal.getFullYear(),mo=cal.getMonth(),pad=(new Date(y,mo,1).getDay()+6)%7,nd=new Date(y,mo+1,0).getDate(),pre=`${y}-${String(mo+1).padStart(2,'0')}`;
let ms=0,mw=0;for(const k in S.days)if(k.startsWith(pre)){ms+=S.days[k].n*S.days[k].wage;mw+=S.days[k].n}
let cells='';for(let i=0;i<pad;i++)cells+='<span></span>';
for(let i=1;i<=nd;i++){const k=iso(new Date(y,mo,i)),e=S.days[k];cells+=`<div class="d ${e?'f':''} ${k===selDay?'sel':''} ${k===TD()?'td':''}" data-a="day" data-k="${k}">${i}${e?`<em>${e.n}</em>`:''}</div>`}
return `<header><h1>Workers</h1></header><section class="card" style="text-align:center"><p class="mu sm">${isT?'Today':fd(selDay)} · workers on site</p><div class="stp"><button data-a="dec" aria-label="Less">−</button><b>${n}</b><button data-a="inc" aria-label="More">+</button></div>
<p>${d?`${n} × ${f(w)} = <b>${f(n*w)}</b>`:'<span class="mu">Not filled for this day</span>'}</p><div class="row g" style="justify-content:center;margin-top:14px"><button class="chip" data-a="half">+ ½ worker</button><button class="chip" data-a="rep">Same as previous day</button><button class="chip" data-a="closed">Site closed</button></div>
<p class="sm" style="margin-top:14px" data-a="sett">Daily wage per worker: ${f(S.wage)} · change</p></section>
<section class="card"><div class="row"><button class="ib" data-a="pm" aria-label="Previous month">‹</button><b>${cal.toLocaleDateString('en-IN',{month:'long',year:'numeric'})}</b><button class="ib" data-a="nm" aria-label="Next month">›</button></div><div class="cal">${['M','T','W','T','F','S','S'].map(x=>`<small>${x}</small>`).join('')}${cells}</div><p class="sm" style="margin-top:12px">This month: ${mw} worker-days · <b>${f(ms)}</b></p></section>`}
function mats(){const t=sum(S.mats),by={};S.mats.forEach(m=>by[m.item]=(by[m.item]||0)+m.amt);const ks=Object.keys(by).sort((a,b)=>by[b]-by[a]),mx=by[ks[0]]||1;
return `<header><h1>Materials</h1></header><section class="card"><p class="mu sm">Total bought</p><h3 data-n="${t}">${f(0)}</h3>${ks.map(k=>`<div class="mb"><div class="row"><span>${esc(k)}</span><b>${f(by[k])}</b></div><div class="bar"><i data-w="${by[k]/mx*100}"></i></div></div>`).join('')}</section>
<section class="card">${S.mats.length?[...S.mats].sort((a,b)=>b.date.localeCompare(a.date)).map((m,i)=>row({t:'m',id:m.id,date:m.date,amt:m.amt,title:m.item,sub:(m.qty?m.qty+' · ':'')+esc(m.shop)},i)).join(''):'<div class="empty">No purchases yet.<br>Tap + to add your first one.</div>'}</section>`}
function row(e,i){return `<div class="it" style="--i:${Math.min(i,12)}" data-a="open" data-t="${e.t}" data-id="${e.id}"><span class="dot ${e.t}"></span><div><b>${esc(e.title)}</b><small>${fd(e.date)}${e.sub?' · '+e.sub:''}</small></div><span class="amt">${f(e.amt)}</span></div>`}
function all(){const a=[];S.given.forEach(x=>a.push({t:'g',id:x.id,date:x.date,amt:x.amt,title:x.note||'Paid to contractor',sub:''}));S.mats.forEach(x=>a.push({t:'m',id:x.id,date:x.date,amt:x.amt,title:x.item,sub:esc(x.shop)}));
for(const k in S.days){const d=S.days[k];if(d.n>0)a.push({t:'l',id:k,date:k,amt:d.n*d.wage,title:d.n+(d.n==1?' worker':' workers'),sub:'Labour'})}
return a.filter(e=>(flt==='all'||e.t===flt)&&(!q||(e.title+e.sub).toLowerCase().includes(q))).sort((a,b)=>b.date.localeCompare(a.date))}
function hl(){const a=all();return a.length?a.map(row).join(''):'<div class="empty">Nothing found.</div>'}
function hist(){const ch=[['all','All'],['g','Paid'],['l','Labour'],['m','Materials']];
return `<header><h1>History</h1></header><input id="q" placeholder="Search by item, shop or note" value="${esc(q)}"><div class="row g" style="margin-bottom:12px">${ch.map(c=>`<button class="chip ${flt===c[0]?'on':''}" data-a="flt" data-v="${c[0]}">${c[1]}</button>`).join('')}</div><section class="card" id="hl">${hl()}</section>`}
function sett(){return `<header><h1>Settings</h1><button class="ib" data-a="go-home" aria-label="Close">✕</button></header>
<section class="card"><label>Daily wage per worker (₹)</label><input id="wg" type="number" inputmode="numeric" value="${S.wage}"><p class="sm">Changing this only affects days you fill in from now on. Past days keep the wage they were saved with.</p></section>
<section class="card"><label>Appearance</label><div class="seg" style="margin:8px 0 0">${['auto','light','dark'].map(t=>`<button class="${S.theme===t?'on':''}" data-a="th" data-v="${t}">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div></section>
<section class="card"><b>Your data</b><p class="sm" style="margin:6px 0 14px">Saved on this device automatically${persisted==='on'?' with protected storage':''}. Keep a backup file too, in case the phone is lost or the browser is cleared.${S.lastBackup?' Last backup: '+new Date(S.lastBackup).toLocaleDateString('en-IN'):''}</p><div class="row g"><button class="btn" data-a="backup">Save backup</button><button class="chip" data-a="csv">Export CSV</button><button class="chip" data-a="restore">Restore</button></div><input type="file" id="rf" accept=".json" hidden></section>`}
/* render */
function render(quiet){document.querySelectorAll('nav [data-t]').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));const v=$('#view'),y=v.scrollTop;
v.innerHTML=`<div class="pg${quiet?' q':''}">`+({home,work,mats,hist,sett})[tab]()+'</div>';v.scrollTop=quiet?y:0;requestAnimationFrame(post)}
function post(){document.querySelectorAll('[data-n]').forEach(e=>{const t=+e.dataset.n,s=performance.now(),st=n=>{const p=Math.min(1,(n-s)/800);e.textContent=f(t*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(st)};requestAnimationFrame(st)});
document.querySelectorAll('[data-w]').forEach(e=>e.style.width=e.dataset.w+'%');document.querySelectorAll('[data-d]').forEach(e=>e.style.strokeDasharray=e.dataset.d)}
function go(t){tab=t;render()}
function setDay(n){S.days[selDay]={n,wage:S.days[selDay]?S.days[selDay].wage:S.wage};save();render(true)}
/* sheet */
function openSheet(t,id){sh={t,id,dr:{}};const e=id?(t==='g'?S.given:S.mats).find(x=>x.id===id):null;if(e)sh.dr=e;shDraw();$('#sh').classList.add('open');$('#ov').classList.add('open')}
function shDraw(){const d=sh.dr,ed=!!sh.id,items=[...new Set(['Cement','Steel','Bricks','Sand','Paint','Tiles',...S.mats.map(m=>m.item)])];
$('#sh').innerHTML=`<div class="grab"></div>${ed?'':`<div class="seg"><button class="${sh.t==='g'?'on':''}" data-a="st" data-v="g">Paid to contractor</button><button class="${sh.t==='m'?'on':''}" data-a="st" data-v="m">Material</button></div>`}
<label>Amount (₹)</label><input id="fa" type="number" inputmode="decimal" placeholder="0" value="${d.amt||''}">
${sh.t==='m'?`<label>Item</label><input id="fi" placeholder="e.g. Cement" value="${esc(d.item)}"><div class="row g" style="margin-bottom:12px">${items.slice(0,10).map(i=>`<button class="chip" data-a="item" data-v="${esc(i)}">${esc(i)}</button>`).join('')}</div>`:`<label>Note (optional)</label><input id="fn" placeholder="e.g. Second instalment" value="${esc(d.note)}">`}
<label>Date</label><input id="fdt" type="date" value="${d.date||TD()}">
${sh.t==='m'?`<details><summary>More details</summary><input id="fq" placeholder="Quantity, e.g. 50 bags" value="${esc(d.qty)}"><input id="fs" placeholder="Shop" value="${esc(d.shop)}"></details>`:''}
<div class="row g"><button class="btn" data-a="save">Save</button>${ed?'<button class="btn gh" data-a="del">Delete</button>':''}</div>`;if(!ed)setTimeout(()=>{const a=$('#fa');a&&a.focus()},350)}
function closeSheet(){$('#sh').classList.remove('open');$('#ov').classList.remove('open')}
function keep(){const g=i=>{const e=$(i);return e?e.value:''};sh.dr=Object.assign(sh.dr,{amt:+g('#fa')||'',date:g('#fdt')||TD(),note:g('#fn'),item:g('#fi'),qty:g('#fq'),shop:g('#fs')})}
function doSave(){keep();const d=sh.dr,a=+d.amt;if(!(a>0)){const e=$('#fa');e.classList.remove('shk');void e.offsetWidth;e.classList.add('shk');return}
const L=sh.t==='g'?S.given:S.mats,o=sh.t==='g'?{id:sh.id||uid(),date:d.date,amt:a,note:(d.note||'').trim()}:{id:sh.id||uid(),date:d.date,amt:a,item:(d.item||'').trim()||'Material',qty:(d.qty||'').trim(),shop:(d.shop||'').trim()};
const i=L.findIndex(x=>x.id===o.id);if(i>=0)L[i]=o;else L.push(o);save();closeSheet();render(true);toast('Saved')}
function doDel(){const L=sh.t==='g'?S.given:S.mats,i=L.findIndex(x=>x.id===sh.id);if(i<0)return;const [r]=L.splice(i,1),t=sh.t;save();closeSheet();render(true);toast('Deleted',()=>{(t==='g'?S.given:S.mats).push(r);save();render(true)})}
let tt;function toast(m,undo){const t=$('#toast');t.innerHTML=m+(undo?' <u data-a="undo">Undo</u>':'');t._u=undo;t.classList.add('show');clearTimeout(tt);tt=setTimeout(()=>t.classList.remove('show'),4000)}
/* backup */
function dl(name,txt,type){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;document.body.appendChild(a);a.click();a.remove()}
function backup(){dl('home-build-backup-'+TD()+'.json',JSON.stringify(S),'application/json');S.lastBackup=Date.now();save();toast('Backup saved');if(tab==='home'||tab==='sett')render(true)}
function csv(){const r=[['Date','Type','Detail','Amount']];all.call?0:0;const old=[flt,q];flt='all';q='';all().reverse().forEach(e=>r.push([e.date,{g:'Paid to contractor',l:'Labour',m:'Material'}[e.t],e.title,e.amt]));[flt,q]=old;
dl('home-build-'+TD()+'.csv',r.map(x=>x.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\n'),'text/csv')}
/* events */
document.addEventListener('click',e=>{const el=e.target.closest('[data-a],[data-t]');if(!el)return;if(el.dataset.t&&!el.dataset.a)return go(el.dataset.t);const a=el.dataset.a,v=el.dataset.v,d=S.days[selDay];
({add:()=>openSheet('g'),close:closeSheet,save:doSave,del:doDel,st:()=>{keep();sh.t=v;shDraw()},item:()=>{$('#fi').value=v},
'go-work':()=>go('work'),'go-mats':()=>go('mats'),'go-home':()=>go('home'),sett:()=>go('sett'),backup,csv,restore:()=>$('#rf').click(),
inc:()=>setDay((d?d.n:0)+1),dec:()=>setDay(Math.max(0,(d?d.n:0)-1)),half:()=>setDay((d?d.n:0)+.5),closed:()=>setDay(0),
rep:()=>{const p=S.days[iso(new Date(new Date(selDay+'T00:00').getTime()-864e5))];p?setDay(p.n):toast('Nothing filled for the previous day')},
day:()=>{selDay=el.dataset.k;render(true)},pm:()=>{cal=new Date(cal.getFullYear(),cal.getMonth()-1,1);render(true)},nm:()=>{cal=new Date(cal.getFullYear(),cal.getMonth()+1,1);render(true)},
flt:()=>{flt=v;render(true)},th:()=>{S.theme=v;save();theme();render(true)},
open:()=>{const t=el.dataset.t;if(t==='l'){selDay=el.dataset.id;cal=new Date(selDay+'T00:00');go('work')}else openSheet(t,el.dataset.id)},
undo:()=>{const t=$('#toast');t._u&&t._u();t.classList.remove('show')}})[a]?.()});
document.addEventListener('input',e=>{if(e.target.id==='q'){q=e.target.value.toLowerCase().trim();$('#hl').innerHTML=hl()}});
document.addEventListener('change',e=>{if(e.target.id==='wg'){const w=+e.target.value;if(w>0){S.wage=w;save();toast('Wage updated')}}
if(e.target.id==='rf'){const fl=e.target.files[0];if(!fl)return;fl.text().then(t=>{try{const o=JSON.parse(t);if(!o||!Array.isArray(o.given)||!Array.isArray(o.mats))throw 0;S=Object.assign(S,o);save();theme();render();toast('Backup restored')}catch(x){toast('That file is not a valid backup')}})}});
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))navigator.serviceWorker.register('sw.js').catch(()=>{});
load();
</script>
</body>
</html>
